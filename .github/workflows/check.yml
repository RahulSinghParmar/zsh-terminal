name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m ruff check .
      - run: python3 -m ruff format --check .
      - name: Offline tests (temporary fake homes only)
        run: python3 -m unittest discover -s tests -v
      - name: Validate public manifests and privacy boundaries
        run: ./setup.sh check
      - name: Shell syntax
        run: |
          /bin/bash -n setup.sh
          if command -v zsh >/dev/null 2>&1; then
            zsh -n dotfiles/zshrc
            zsh -n dotfiles/zprofile
            zsh -n dotfiles/p10k.zsh
          fi
      - name: Restore preview only
        run: ./setup.sh restore --profile full --extras
